<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Form Header (Navbar) in Blue -->
        <header class="form-header">
            <span class="badge">Academic Year 2026 - 2027</span>
            <h1>College Student Registration</h1>
            <p>Please fill out the form below with valid information to complete your official student admission process.</p>
        </header>

        <form action="thankyou.html" method="get">
            
            <!-- Section 1: Personal Information -->
            <fieldset class="form-section">
                <legend class="section-legend">
                    <span class="section-icon">👤</span>
                    Personal Information
                </legend>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name <span class="required">*</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. Alex Johnson" required>
                    </div>

                    <div class="form-group">
                        <label for="rollNo">Roll Number / Student ID <span class="required">*</span></label>
                        <input type="text" id="rollNo" name="rollNo" placeholder="e.g. CS2026-042" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label>Gender <span class="required">*</span></label>
                        <div class="radio-options">
                            <label class="radio-card">
                                <input type="radio" id="male" name="gender" value="Male" required>
                                Male
                            </label>
                            <label class="radio-card">
                                <input type="radio" id="female" name="gender" value="Female">
                                Female
                            </label>
                            <label class="radio-card">
                                <input type="radio" id="other" name="gender" value="Other">
                                Other
                            </label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <!-- Section 2: Contact Information -->
            <fieldset class="form-section">
                <legend class="section-legend">
                    <span class="section-icon">📞</span>
                    Contact Information
                </legend>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="student@university.edu" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Residential Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter flat/house no, street, city, state and zip code"></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- Section 3: Academic Details -->
            <fieldset class="form-section">
                <legend class="section-legend">
                    <span class="section-icon">🎓</span>
                    Academic Details
                </legend>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="course">Course / Degree <span class="required">*</span></label>
                        <select id="course" name="course" required>
                            <option value="" disabled selected>Select course</option>
                            <option value="B.Tech">B.Tech (Bachelor of Technology)</option>
                            <option value="B.Sc">B.Sc (Bachelor of Science)</option>
                            <option value="B.Com">B.Com (Bachelor of Commerce)</option>
                            <option value="BCA">BCA (Bachelor of Computer Applications)</option>
                            <option value="B.A">B.A (Bachelor of Arts)</option>
                            <option value="M.Tech">M.Tech (Master of Technology)</option>
                            <option value="MCA">MCA (Master of Computer Applications)</option>
                            <option value="MBA">MBA (Master of Business Administration)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="department">Department / Branch <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="" disabled selected>Select department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics">Electronics & Communication Engineering</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Business">Management & Business Studies</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="year">Year of Study <span class="required">*</span></label>
                        <select id="year" name="year" required>
                            <option value="" disabled selected>Select year of study</option>
                            <option value="1st Year">1st Year (Freshman)</option>
                            <option value="2nd Year">2nd Year (Sophomore)</option>
                            <option value="3rd Year">3rd Year (Junior)</option>
                            <option value="4th Year">4th Year (Senior)</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Reset Form</button>
                <button type="submit" class="btn btn-primary">Submit Registration ✨</button>
            </div>

        </form>
    </div>

</body>
</html>
